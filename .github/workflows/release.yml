name: Release skill

# Publishes vibe-plus.skill as a GitHub Release asset. Three ways to run it:
#  - Actions tab → "Release skill" → Run workflow, enter a tag like v0.1.0
#  - Publish a release in the GitHub UI (the asset gets attached to it)
#  - Push a tag like v0.1.0
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release (e.g. v0.1.0)
        required: true
  release:
    types: [published]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter
        run: |
          f=skills/vibe-plus/SKILL.md
          head -1 "$f" | grep -qx -- '---'
          grep -q '^name: vibe-plus$' "$f"
          grep -q '^description: ' "$f"

      - name: Package
        run: cd skills && zip -r ../vibe-plus.skill vibe-plus -x '*.DS_Store' '*/__pycache__/*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vibe-plus.skill --clobber
          else
            gh release create "$TAG" vibe-plus.skill --target "$GITHUB_SHA" --title "vibe-plus $TAG" --generate-notes
          fi
